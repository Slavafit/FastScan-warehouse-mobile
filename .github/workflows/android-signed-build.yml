name: Build signed Android artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Upload the signed AAB to Google Play internal testing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FASTSCAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FASTSCAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FASTSCAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FASTSCAN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing FASTSCAN_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing FASTSCAN_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing FASTSCAN_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing FASTSCAN_KEY_PASSWORD"; exit 1; }

      - name: Validate Google Play service account
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_play
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$SERVICE_ACCOUNT_JSON" || {
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          }
          printf '%s' "$SERVICE_ACCOUNT_JSON" | jq -e '
            .type == "service_account" and
            (.client_email | type == "string") and
            (.private_key | type == "string")
          ' >/dev/null || {
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not a valid service-account JSON key"
            exit 1
          }

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FASTSCAN_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fastscan-upload.jks"

      - name: Validate signing key credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FASTSCAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FASTSCAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FASTSCAN_KEY_PASSWORD }}
        run: |
          if ! keytool -list \
            -keystore "$RUNNER_TEMP/fastscan-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The keystore file or FASTSCAN_KEYSTORE_PASSWORD is invalid"
            exit 1
          fi
          if ! keytool -list \
            -keystore "$RUNNER_TEMP/fastscan-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::FASTSCAN_KEY_ALIAS does not identify a key in this keystore"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing-check"
          printf 'FastScan signing check' > "$RUNNER_TEMP/signing-check/content.txt"
          jar --create --file "$RUNNER_TEMP/signing-check.jar" -C "$RUNNER_TEMP/signing-check" content.txt
          if ! jarsigner \
            -keystore "$RUNNER_TEMP/fastscan-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$RUNNER_TEMP/signing-check.jar" \
            "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::FASTSCAN_KEY_PASSWORD is invalid for the selected key"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing-check/content.txt" "$RUNNER_TEMP/signing-check.jar"
          rmdir "$RUNNER_TEMP/signing-check"

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\)/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION_NAME" || { echo "::error::Could not read versionName"; exit 1; }
          test -n "$VERSION_CODE" || { echo "::error::Could not read versionCode"; exit 1; }
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          test "v$VERSION_NAME" = "$GITHUB_REF_NAME" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point to a commit from main"
            exit 1
          }

      - name: Test and build signed artifacts
        env:
          FASTSCAN_KEYSTORE_PATH: ${{ runner.temp }}/fastscan-upload.jks
          FASTSCAN_KEYSTORE_PASSWORD: ${{ secrets.FASTSCAN_KEYSTORE_PASSWORD }}
          FASTSCAN_KEY_ALIAS: ${{ secrets.FASTSCAN_KEY_ALIAS }}
          FASTSCAN_KEY_PASSWORD: ${{ secrets.FASTSCAN_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease bundleRelease

      - name: Verify APK and AAB signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab >/dev/null 2>&1
          echo "AAB signature verified"

      - name: Prepare downloads
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FastScan-${{ steps.version.outputs.name }}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/FastScan-${{ steps.version.outputs.name }}-release.aab"
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastScan-${{ steps.version.outputs.name }}-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to Google Play internal testing
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.slavafit.fastscan
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: FastScan ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fastscan-upload.jks"
